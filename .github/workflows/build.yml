name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Finish an active main-branch deployment before starting the next one.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test data, application state and deployment script
        run: npm test

      # The build script also runs strict TypeScript checking.
      # Use the committed data snapshots; CI does not refresh remote incident or map datasets.
      - name: Typecheck and build production assets
        env:
          BASE_PATH: /london-animal-rescue/
        run: npm run build

      - name: Upload production build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: london-animal-rescue-dist
          path: dist/
          # Include the app's Apache compression configuration.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  deploy:
    name: Deploy to app.teinum.no/london-animal-rescue
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://app.teinum.no/london-animal-rescue/

    steps:
      - name: Check out deployment script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download tested production build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: london-animal-rescue-dist
          path: dist/

      - name: Deploy using SSH and rsync
        env:
          CPANEL_HOST: ${{ vars.CPANEL_HOST }}
          CPANEL_PORT: ${{ vars.CPANEL_PORT || '22' }}
          CPANEL_USERNAME: ${{ vars.CPANEL_USERNAME }}
          CPANEL_DEPLOY_PATH: /app.teinum.no/london-animal-rescue
          CPANEL_SSH_KEY: ${{ secrets.CPANEL_SSH_KEY }}
          CPANEL_PASSWORD: ${{ secrets.CPANEL_PASSWORD }}
          CPANEL_SSH_KNOWN_HOSTS: ${{ secrets.CPANEL_SSH_KNOWN_HOSTS }}
        run: bash scripts/deploy-cpanel.sh dist

      - name: Verify the public site serves this build
        shell: bash
        run: |
          curl --fail --silent --show-error --location \
            --retry 3 --retry-all-errors --retry-delay 3 \
            --connect-timeout 10 --max-time 45 \
            "https://app.teinum.no/london-animal-rescue/?deployment=${GITHUB_SHA}" \
            --output "$RUNNER_TEMP/london-animal-rescue-live.html"
          if ! cmp --silent dist/index.html "$RUNNER_TEMP/london-animal-rescue-live.html"; then
            echo 'The public URL does not serve the uploaded index.html. Check the document root and any HTML cache or rewriting.' >&2
            exit 1
          fi
